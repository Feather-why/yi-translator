<!doctype html><html lang="en" style="position:relative;margin-top:24px"><head><meta charset="utf-8"><title>Zoomed image test</title>
<script>document.documentElement.style.zoom = new URLSearchParams(location.search).get('z') || '1';</script>
<style>body{font-family:Georgia,serif;max-width:900px;margin:30px auto;color:#222} .box{transform:scale(.9);transform-origin:0 0} img{display:block;width:60%;border-radius:8px}</style></head>
<body><h1>Zoomed page</h1><p>The page itself is zoomed with CSS, and the image is scaled by a transform.</p>
<div class="box"><img id="sign" src="sign.png" alt="banner"></div><p>Text after the image.</p></body></html>
