<!doctype html><html><head><meta charset="utf-8"><title>Inputs</title>
<style>body{font:16px/1.6 system-ui,sans-serif;margin:40px;max-width:760px}textarea,input,[contenteditable]{display:block;width:100%;box-sizing:border-box;margin:14px 0;font:inherit;padding:8px;border:1px solid #bbb;border-radius:6px}textarea{height:110px}[contenteditable]{min-height:80px}</style></head>
<body>
<h1>Write a reply</h1>
<p id="en">The reviewers asked for a clearer explanation of the method and a few more experiments on the real vehicle.</p>
<p id="zh">评审希望我们把方法讲得更清楚一些，并在真实的水下机器人上多做几组实验。</p>
<textarea id="ta" placeholder="Reply"></textarea>
<input id="one" type="text" placeholder="Subject">
<input id="pw" type="password" placeholder="Password">
<div id="ce" contenteditable="true"></div>
</body></html>
